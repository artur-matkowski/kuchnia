# versioner policy for this repo. Layered over versioner/defaults/*.conf, later wins;
# `./versioner/bin/versioner config` prints what is actually in effect. See docs/versioning.md.

# The branch whose packages carry a bare X.Y.Z. Every other branch gets the
# -<branch>.<hash> prerelease suffix, which sorts below the release it promotes to.
production_branches=main

# Everything that changes the binary a board runs bumps the version, because a version
# that did not change is a package that is never published. docs, style, test, ci and
# chore stay at the shipped default of noop: none of them reaches a board.
bump.refactor=patch
bump.perf=patch
bump.build=patch
bump.revert=patch
