; Four programs, and only the first of them is running most of the time. The other three are
; the sign-in screen: they exist for the few minutes somebody is renewing the Google session,
; started and stopped from the settings page - see app/signin.py.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; A unix socket rather than a loopback port: this is what starts and stops the browser, and a
; file mode is a real guard where a port is reachable by anything in the network namespace.
; supervisord logs a CRIT line about the missing HTTP auth either way - it says that for every
; server it opens - and the mode below is the check it is not counting.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=kuchnia:kuchnia

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:web]
command=python3 -m app
directory=/app
user=kuchnia
environment=HOME="/home/kuchnia",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; VNC_PASSWORD guards this screen at the HTTP layer, in web.py, and not here. Two reasons,
; and the second is the one that matters:
;
;  * Debian's tigervnc packages ship no vncpasswd at all, and the .vnc/passwd format is DES -
;    so VncAuth here would mean vendoring a DES implementation to protect a loopback socket.
;  * RFB's VncAuth uses only the FIRST EIGHT CHARACTERS of a password and silently ignores the
;    rest. HTTP Basic compares the whole string, so this is the stronger of the two checks.
;
; What makes that safe is -localhost: the RFB port is reachable from inside this container and
; nowhere else, websockify is loopback too, and the only way in is /vnc/ - which is behind the
; password. A `network_mode: host` in the compose file would break that, which is why there
; isn't one.
[program:xvnc]
command=/usr/bin/Xvnc :0 -geometry 1440x900 -depth 24 -rfbport 5900 -localhost
    -SecurityTypes None -AlwaysShared -desktop kuchnia-signin
user=kuchnia
environment=HOME="/home/kuchnia"
autostart=false
autorestart=unexpected
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Serves noVNC's own files as well as bridging RFB, which is why one proxy in web.py covers
; both the page and its websocket.
[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=kuchnia
environment=HOME="/home/kuchnia"
autostart=false
autorestart=unexpected
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -width and -height match Xvnc's geometry because there is no window manager on this display
; and nothing else would size the window - a browser drawn at its default size leaves most of
; the screen black. It also means no window can be moved or resized, which is the trade: the
; Google sign-in is all in-page, so nothing needs to be.
;
; autorestart is off: closing the window is a thing a person does on purpose.
;
; stopsignal TERM and twenty seconds to obey it, because a clean Firefox shutdown is what
; checkpoints cookies.sqlite - and that file is the entire point of this program. killasgroup
; only matters after those twenty seconds, and then only to keep content processes from being
; orphaned onto pid 1.
[program:browser]
command=/usr/bin/firefox-esr --profile /profile --no-remote -width 1440 -height 900
    https://myaccount.google.com/
user=kuchnia
environment=HOME="/home/kuchnia",DISPLAY=":0",MOZ_ENABLE_WAYLAND="0"
autostart=false
autorestart=false
priority=30
stopsignal=TERM
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
