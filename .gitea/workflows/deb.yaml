# Build the arm64 package and publish it to this Gitea's Debian registry.
#
# Two branches are two APT components, and that is the whole channel model: a board's
# sources.list names one of them. Everything else builds and publishes nothing.
name: deb

# A second push to the same ref makes the first one's package obsolete before it is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, testing]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # The build environment is a published image and not the label's own, because every
    # dependency is already in it - see docs/ci.md. The volume is the ccache, and the runner
    # only permits it because its config.yaml names the path in container.valid_volumes; a
    # runner that does not fails the job here, before a step runs.
    container:
      image: ${{ vars.BUILDER_IMAGE }}
      options: -v /srv/ci-cache/kuchnia:/ccache

    steps:
      # A plain clone rather than actions/checkout: this needs no node in the container and
      # no reachable action registry. The repository is public; a private one would fail here.
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"
          git submodule update --init --recursive --depth 1

      # The version is folded out of the commit messages - docs/versioning.md. The checkout
      # above is detached, so versioner takes the branch from GITHUB_REF_NAME: a bare X.Y.Z
      # on main, X.Y.Z-<branch>.<hash> everywhere else. A native package's version may not
      # contain a hyphen, and the tilde it becomes is also what keeps a branch build sorting
      # below the release it will be promoted into.
      - name: Version and channel
        id: channel
        run: |
          version="$(./versioner/bin/versioner version | tr -- '-' '~')"
          case "${GITHUB_REF_NAME}" in
            main)    component=main ;;
            testing) component=testing ;;
            *)       component="" ;;
          esac
          echo "version=${version}"     >> "$GITHUB_OUTPUT"
          echo "component=${component}" >> "$GITHUB_OUTPUT"
          echo "==> ${version} -> ${component:-nowhere}"

      - name: Build
        run: scripts/build-deb.sh --here --version "${{ steps.channel.outputs.version }}"

      # A cache that is not being hit is a build that is merely slow, which is the one
      # failure here that reports nothing. This is where it says so.
      - name: Cache
        run: ccache --show-stats --verbose

      # Gitea authenticates a token by the token, not by the name beside it, so the
      # username here is a placeholder and only PACKAGE_TOKEN has to exist.
      #
      # apt takes the highest version it can see and never reports one it passed over, so
      # both ways this can go wrong are silent on a board: a version already in the pool
      # would upload nothing new, and a version below it would sit there unfetched for ever.
      # The pool is read first and each is answered separately - docs/versioning.md.
      - name: Publish
        if: steps.channel.outputs.component != ''
        run: |
          version="${{ steps.channel.outputs.version }}"
          component="${{ steps.channel.outputs.component }}"
          registry="${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY%%/*}/debian"
          highest=""
          # An absent index is a component's first upload, not a failure.
          while read -r v; do
            if [ -z "$highest" ] || dpkg --compare-versions "$v" gt "$highest"; then
              highest="$v"
            fi
          done < <(curl --fail --silent "${registry}/dists/trixie/${component}/binary-arm64/Packages" \
                     | sed -n 's/^Version: //p' || true)
          if [ -n "$highest" ]; then
            echo "==> ${component} holds ${highest}"
            if dpkg --compare-versions "$version" eq "$highest"; then
              echo "==> nothing in this push bumped the version; publishing nothing"
              exit 0
            fi
            if ! dpkg --compare-versions "$version" gt "$highest"; then
              echo "error: ${version} is below ${component}'s ${highest}; no board would fetch it" >&2
              exit 1
            fi
          fi
          curl --fail --silent --show-error \
            --user "ci:${PACKAGE_TOKEN}" \
            --upload-file "dist/kuchnia_${version}_arm64.deb" \
            "${registry}/pool/trixie/${component}/upload"
          echo "==> published ${version} to ${component}"
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
