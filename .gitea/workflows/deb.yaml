# Build the arm64 package and publish it to this Gitea's Debian registry.
#
# Two branches are two APT components, and that is the whole channel model: a board's
# sources.list names one of them. Everything else builds and publishes nothing.
name: deb

# A second push to the same ref makes the first one's package obsolete before it is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, testing]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # The build environment is a published image and not the label's own, because every
    # dependency is already in it - see docs/ci.md. The volume is the ccache, and the runner
    # only permits it because its config.yaml names the path in container.valid_volumes; a
    # runner that does not fails the job here, before a step runs.
    container:
      image: ${{ vars.BUILDER_IMAGE }}
      options: -v /srv/ci-cache/kuchnia:/ccache

    steps:
      # A plain clone rather than actions/checkout: this needs no node in the container and
      # no reachable action registry. The repository is public; a private one would fail here.
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"
          git submodule update --init --recursive --depth 1

      # GITHUB_RUN_NUMBER is per repository and only ever climbs, so a testing build is
      # newer than the last main build and the next main build is newer than both. The
      # tilde is what keeps 1.0.7~testing below the 1.0.7 that eventually promotes it.
      - name: Version and channel
        id: channel
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          case "${GITHUB_REF_NAME}" in
            main)    component=main ;;
            testing) component=testing; version="${version}~testing" ;;
            # A native package's version may not contain a hyphen, and a branch name
            # usually does.
            *)       component=""
                     version="${version}~$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9' '.')" ;;
          esac
          echo "version=${version}"     >> "$GITHUB_OUTPUT"
          echo "component=${component}" >> "$GITHUB_OUTPUT"
          echo "==> ${version} -> ${component:-nowhere}"

      - name: Build
        run: scripts/build-deb.sh --here --version "${{ steps.channel.outputs.version }}"

      # A cache that is not being hit is a build that is merely slow, which is the one
      # failure here that reports nothing. This is where it says so.
      - name: Cache
        run: ccache --show-stats --verbose

      # Gitea authenticates a token by the token, not by the name beside it, so the
      # username here is a placeholder and only PACKAGE_TOKEN has to exist.
      - name: Publish
        if: steps.channel.outputs.component != ''
        run: |
          curl --fail --silent --show-error \
            --user "ci:${PACKAGE_TOKEN}" \
            --upload-file "dist/kuchnia_${{ steps.channel.outputs.version }}_arm64.deb" \
            "${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY%%/*}/debian/pool/trixie/${{ steps.channel.outputs.component }}/upload"
          echo "==> published to ${{ steps.channel.outputs.component }}"
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
